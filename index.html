<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>No Hesi - 3D Racing</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0f1a;font-family:system-ui,sans-serif;height:100%;width:100%;touch-action:none;}
  #canvas{display:block;width:100%;height:100%;}
  #hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.8);z-index:10;}
  .stat{font-size:12px;opacity:.8;letter-spacing:1px;} .big{font-size:30px;font-weight:800;line-height:1;}
  #score{font-size:22px;font-weight:700;}
  #controls{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;z-index:10;}
  .pad{display:flex;gap:10px;pointer-events:auto;}
  .btn{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;}
  .btn:active,.btn.pressed{background:rgba(255,255,255,.35);}
  .btn.gas{background:rgba(0,200,100,.25);}
  .btn.brake{background:rgba(200,0,0,.25);}
  #overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);color:#fff;z-index:20;text-align:center;padding:20px;}
  #overlay.show{display:flex;}
  #overlay h1{font-size:46px;margin:0 0 8px;}
  #overlay p{margin:4px 0;opacity:.85;}
  #startbtn{margin-top:18px;padding:12px 36px;font-size:18px;border:none;border-radius:8px;background:#00c864;color:#fff;font-weight:700;cursor:pointer;}
  #nearmiss{position:fixed;top:90px;left:50%;transform:translateX(-50%);color:#ffd700;font-weight:800;font-size:20px;opacity:0;pointer-events:none;z-index:10;transition:opacity .3s;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hud">
  <div><div class="stat">SPEED</div><div class="big" id="speed">0</div><div class="stat">KM/H</div></div>
  <div style="text-align:center;"><div class="stat">SCORE</div><div id="score">0</div></div>
  <div style="text-align:right;"><div class="stat">BEST</div><div id="best">0</div></div>
</div>
<div id="nearmiss">NEAR MISS +50</div>
<div id="controls">
  <div class="pad">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div class="pad">
    <div class="btn brake" id="brake">■</div>
    <div class="btn gas" id="gas">▲</div>
  </div>
</div>
<div id="overlay" class="show">
  <h1>NO HESI</h1>
  <p>Weave through highway traffic. Don't crash.</p>
  <p>Arrows / WASD + Space to brake. Touch buttons on mobile.</p>
  <button id="startbtn">START</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 70, 230);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);

const amb = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(amb);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(50,80,30);
scene.add(sun);

const ROAD_W = 14;
const SEG_LEN = 50;
const NUM_SEG = 10;

const grassMat = new THREE.MeshLambertMaterial({color:0x3a7d3a});
const grass = new THREE.Mesh(new THREE.PlaneGeometry(1200,1200), grassMat);
grass.rotation.x = -Math.PI/2;
grass.position.y = -0.06;
scene.add(grass);

const asphaltMat = new THREE.MeshLambertMaterial({color:0x2a2a2a});
const lineMat = new THREE.MeshBasicMaterial({color:0xffffff});
const edgeMat = new THREE.MeshBasicMaterial({color:0xffcc00});

const roadSegments = [];
function makeSegment(z) {
  const g = new THREE.Group();
  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, SEG_LEN), asphaltMat);
  road.rotation.x = -Math.PI/2;
  g.add(road);
  for (let s=-1;s<=1;s+=2){
    const e = new THREE.Mesh(new THREE.PlaneGeometry(0.25, SEG_LEN), edgeMat);
    e.rotation.x=-Math.PI/2;
    e.position.set(s*(ROAD_W/2-0.12),0.01,0);
    g.add(e);
  }
  for (let li=0; li<2; li++){
    const lx = -ROAD_W/2 + (li+1)*(ROAD_W/3);
    for (let d=0; d<8; d++){
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.15, SEG_LEN/8-0.8), lineMat);
      dash.rotation.x=-Math.PI/2;
      const dz = -SEG_LEN/2 + d*(SEG_LEN/8) + (SEG_LEN/16);
      dash.position.set(lx,0.02,dz);
      g.add(dash);
    }
  }
  g.position.z = z;
  scene.add(g);
  roadSegments.push(g);
}
for (let i=0;i<NUM_SEG;i++) makeSegment(-SEG_LEN/2 + i*SEG_LEN);

function makeCar(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.7,4.0), new THREE.MeshLambertMaterial({color}));
  body.position.y = 0.5;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.6,1.8), new THREE.MeshLambertMaterial({color:0x222222}));
  cabin.position.set(0,1.05,-0.2);
  g.add(cabin);
  const wMat = new THREE.MeshLambertMaterial({color:0x111111});
  const wGeo = new THREE.CylinderGeometry(0.35,0.35,0.3,12);
  for (const [x,z] of [[-1,1.3],[1,1.3],[-1,-1.3],[1,-1.3]]){
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI/2;
    w.position.set(x,0.35,z);
    g.add(w);
  }
  return g;
}

const playerCar = makeCar(0xff3333);
scene.add(playerCar);
playerCar.position.set(0,0,0);

const trafficColors = [0x1e90ff,0xffffff,0xffd700,0x800080,0x00ced1,0xff8c00,0x2e8b57];
const traffic = [];
function spawnTraffic(zBase){
  const car = makeCar(trafficColors[Math.floor(Math.random()*trafficColors.length)]);
  const lane = Math.floor(Math.random()*3)-1;
  const x = lane*(ROAD_W/3) + (Math.random()-0.5)*0.6;
  const speed = 8 + Math.random()*16;
  car.position.set(x,0,zBase);
  scene.add(car);
  traffic.push({mesh:car, x, z:zBase, speed, scored:false});
}
function resetTraffic(){
  traffic.forEach(t=>scene.remove(t.mesh));
  traffic.length=0;
  for (let i=0;i<14;i++) spawnTraffic(40 + i*22 + Math.random()*8);
}

let state = 'menu';
let player = { x:0, z:0, yaw:0, speed:0, steer:0, gas:false, brake:false };
let score = 0;
let best = Number(localStorage.getItem('best')||0);
let dist = 0;
document.getElementById('best').textContent = best;

let audioCtx=null, engineOsc=null, engineGain=null;
function initAudio(){
  if(audioCtx) return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    engineOsc=audioCtx.createOscillator();
    engineGain=audioCtx.createGain();
    engineOsc.type='sawtooth';
    engineOsc.frequency.value=60;
    engineGain.gain.value=0;
    engineOsc.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
  }catch(e){ audioCtx=null; }
}
function crashSound(){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='square';
    o.frequency.value=120;
    g.gain.value=0.3;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.5);
    o.stop(audioCtx.currentTime+0.5);
  }catch(e){}
}
const particles=[];
function spawnExplosion(x,z){
  for(let i=0;i<24;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.25,6,6), new THREE.MeshBasicMaterial({color:Math.random()>0.5?0xff6600:0xffcc00}));
    m.position.set(x,0.6,z);
    scene.add(m);
    const a=Math.random()*Math.PI*2;
    const sp=2+Math.random()*4;
    particles.push({mesh:m, vx:Math.cos(a)*sp, vz:Math.sin(a)*sp, vy:2+Math.random()*3, life:1});
  }
}

const keys = {};
window.addEventListener('keydown', e=>{keys[e.key.toLowerCase()]=true; if(e.key===' ') e.preventDefault();});
window.addEventListener('keyup', e=>{keys[e.key.toLowerCase()]=false;});

function bindBtn(id, onDown, onUp){
  const el = document.getElementById(id);
  const down = e=>{e.preventDefault(); onDown(); el.classList.add('pressed');};
  const up = e=>{e.preventDefault(); onUp(); el.classList.remove('pressed');};
  el.addEventListener('touchstart', down, {passive:false});
  el.addEventListener('touchend', up, {passive:false});
  el.addEventListener('touchcancel', up, {passive:false});
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}
bindBtn('left', ()=>player.steer=-1, ()=>{if(player.steer===-1)player.steer=0;});
bindBtn('right', ()=>player.steer=1, ()=>{if(player.steer===1)player.steer=0;});
bindBtn('gas', ()=>player.gas=true, ()=>player.gas=false);
bindBtn('brake', ()=>player.brake=true, ()=>player.brake=false);

function showNearMiss(){
  const el = document.getElementById('nearmiss');
  el.style.opacity = 1;
  clearTimeout(showNearMiss._t);
  showNearMiss._t = setTimeout(()=>el.style.opacity=0, 700);
}

function startGame(){
  player.x=0;player.z=0;player.yaw=0;player.speed=0;player.steer=0;player.gas=false;player.brake=false;
  score=0; dist=0;
  resetTraffic();
  particles.forEach(p=>scene.remove(p.mesh)); particles.length=0;
  initAudio();
  if(audioCtx) audioCtx.resume();
  state='play';
  document.getElementById('overlay').classList.remove('show');
}
function crash(){
  state='over';
  if (score>best){best=score;localStorage.setItem('best',best);document.getElementById('best').textContent=best;}
  crashSound();
  spawnExplosion(player.x, player.z);
  if(engineGain) engineGain.gain.value=0;
  const ov = document.getElementById('overlay');
  ov.classList.add('show');
  ov.querySelector('h1').textContent='CRASHED';
  ov.querySelector('p').textContent = `Score ${Math.floor(score)}  •  Distance ${Math.floor(dist)}m`;
}
document.getElementById('startbtn').addEventListener('click', startGame);

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;

  if (state==='play'){
    let steerInput = player.steer;
    if (keys['arrowleft']||keys['a']) steerInput = -1;
    if (keys['arrowright']||keys['d']) steerInput = 1;
    const gas = player.gas || keys['arrowup']||keys['w'];
    const brake = player.brake || keys['arrowdown']||keys['s']||keys[' '];

    const maxSpeed = 72;
    if (gas) player.speed += 20*dt;
    else player.speed -= 7*dt;
    if (brake) player.speed -= 40*dt;
    player.speed = Math.max(0, Math.min(maxSpeed, player.speed));
    const halfRoad = ROAD_W/2 - 1;
    if (Math.abs(player.x) > halfRoad){
      player.speed *= (1 - 3*dt);
      if (player.speed<0) player.speed=0;
    }
    const steerRate = 2.4 * (0.35 + 0.65*(player.speed/maxSpeed));
    player.yaw += steerInput * steerRate * dt;
    player.x += Math.sin(player.yaw)*player.speed*dt;
    player.z += Math.cos(player.yaw)*player.speed*dt;
    dist = player.z;
    score += player.speed*dt*0.6;

    if (player.x < -ROAD_W/2+0.9){ player.x = -ROAD_W/2+0.9; player.yaw*=0.85; }
    if (player.x > ROAD_W/2-0.9){ player.x = ROAD_W/2-0.9; player.yaw*=0.85; }

    for (let i=traffic.length-1;i>=0;i--){
      const t = traffic[i];
      t.z += t.speed*dt;
      t.mesh.position.set(t.x,0,t.z);
      if (t.z < player.z - 25){
        scene.remove(t.mesh);
        traffic.splice(i,1);
        const farthest = traffic.reduce((m,c)=>Math.max(m,c.z), player.z);
        spawnTraffic(farthest + 22 + Math.random()*18);
      }
      const dz = Math.abs(t.z - player.z);
      const dx = Math.abs(t.x - player.x);
      if (dz < 3.0 && dx < 1.9){
        crash();
      }
      if (!t.scored && t.z < player.z - 1.5 && t.z > player.z - 6 && dx < 2.7 && dx > 1.9){
        t.scored = true;
        score += 50;
        showNearMiss();
      }
      if (!t.scored && t.z < player.z - 2){ t.scored = true; }
    }

    roadSegments.forEach(seg=>{
      if (seg.position.z < player.z - SEG_LEN*2){
        const front = roadSegments.reduce((m,s)=>Math.max(m,s.position.z), seg.position.z);
        seg.position.z = front + SEG_LEN;
      }
    });

    grass.position.x = player.x*0.5;
    grass.position.z = player.z;

    playerCar.position.set(player.x,0,player.z);
    playerCar.rotation.y = player.yaw;

    const camDist = 9;
    const camHeight = 4.5;
    const fx = Math.sin(player.yaw);
    const fz = Math.cos(player.yaw);
    const targetCam = new THREE.Vector3(player.x - fx*camDist, camHeight, player.z - fz*camDist);
    camera.position.lerp(targetCam, 0.15);
    camera.lookAt(player.x + fx*8, 1, player.z + fz*8);

    document.getElementById('speed').textContent = Math.round(player.speed*3.6*0.6);
    document.getElementById('score').textContent = Math.floor(score);
    if(engineOsc && engineGain){
      engineOsc.frequency.value = 50 + player.speed*2.2;
      engineGain.gain.value = 0.02 + (player.speed/72)*0.07;
    }
  } else if(engineGain){
    engineGain.gain.value = 0;
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life -= dt;
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.z += p.vz*dt;
    p.mesh.position.y += p.vy*dt;
    p.vy -= 9.8*dt;
    p.mesh.scale.setScalar(Math.max(0.01, p.life));
    if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); }
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
